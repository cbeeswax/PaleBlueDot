<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Liftoff — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: "Baloo 2", system-ui, sans-serif; background: #070a1a; color: #eaf0ff; display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .stage { position: relative; width: min(860px, 96vw); aspect-ratio: 4 / 3; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 80px -30px #000, inset 0 0 0 1px #1b2550; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* animations */
  @keyframes rise { 0% { transform: translateY(0); } 100% { transform: translateY(-16px); } }
  @keyframes flameFlicker { 0%,100% { transform: scaleY(1) scaleX(1); opacity: 1; } 50% { transform: scaleY(1.12) scaleX(.92); opacity: .9; } }
  @keyframes smokeBillow { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }
  @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-.6px); } 75% { transform: translateX(.6px); } }
  #rocket { animation: rise 6s ease-in forwards, shake .14s linear infinite; transform-origin: 50% 100%; }
  .flame { animation: flameFlicker .16s ease-in-out infinite; transform-origin: 50% 0%; transform-box: fill-box; }
  .smoke { animation: smokeBillow 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .smoke:nth-child(2) { animation-delay: .5s; } .smoke:nth-child(3) { animation-delay: 1s; } .smoke:nth-child(4) { animation-delay: 1.5s; } .smoke:nth-child(5) { animation-delay: .8s; }
  .star { animation: twinkle 3s ease-in-out infinite; }
  /* HUD overlays */
  .caption { position: absolute; left: 20px; bottom: 18px; font-family: "Space Grotesk", sans-serif; z-index: 3; }
  .caption .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #8fb4ff; font-weight: 700; }
  .caption .t { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .caption .s { font-size: 12.5px; color: #aab8e6; }
  .hud { position: absolute; top: 16px; right: 18px; z-index: 3; text-align: right; font-family: "Space Grotesk", sans-serif; }
  .hud .label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #7f9ce0; }
  .hud .big { font-size: 34px; font-weight: 700; color: #ffd36b; line-height: 1; }
  .meter { margin-top: 8px; width: 130px; height: 7px; border-radius: 6px; background: #17224d; overflow: hidden; margin-left: auto; }
  .meter i { display: block; height: 100%; width: 38%; background: linear-gradient(90deg, #4fd1c5, #ffd36b); }
  .tag { position: absolute; z-index: 3; font-family: "Space Grotesk", sans-serif; font-size: 10.5px; color: #cdd9ff; background: rgba(10,16,40,.72); border: 1px solid #28356b; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-label="Voyager 1 lifting off on a Titan IIIE-Centaur rocket">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#05081c"/><stop offset="0.5" stop-color="#0a1740"/><stop offset="1" stop-color="#20356e"/>
      </linearGradient>
      <radialGradient id="dawn" cx="0.5" cy="1" r="0.9">
        <stop offset="0" stop-color="#ff9a52" stop-opacity="0.5"/><stop offset="0.4" stop-color="#ff6b8a" stop-opacity="0.18"/><stop offset="1" stop-color="#20356e" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#cdd6e6"/><stop offset="0.35" stop-color="#ffffff"/><stop offset="0.65" stop-color="#eef2f8"/><stop offset="1" stop-color="#aab4c6"/>
      </linearGradient>
      <linearGradient id="booster" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8793a8"/><stop offset="0.4" stop-color="#e6ebf2"/><stop offset="1" stop-color="#7b879c"/>
      </linearGradient>
      <linearGradient id="flameG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff7d6"/><stop offset="0.35" stop-color="#ffd36b"/><stop offset="0.7" stop-color="#ff8a3c"/><stop offset="1" stop-color="#ff5a2c" stop-opacity="0.4"/>
      </linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#ffd36b" stop-opacity="0.8"/><stop offset="1" stop-color="#ffd36b" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="800" height="600" fill="url(#sky)"/>
    <rect width="800" height="600" fill="url(#dawn)"/>
    <!-- stars -->
    <g fill="#ffffff">
      <circle class="star" cx="80" cy="70" r="1.6"/><circle class="star" cx="180" cy="130" r="1.1" style="animation-delay:.6s"/>
      <circle class="star" cx="300" cy="60" r="1.4" style="animation-delay:1.2s"/><circle class="star" cx="520" cy="90" r="1.2" style="animation-delay:.3s"/>
      <circle class="star" cx="650" cy="150" r="1.7" style="animation-delay:1.8s"/><circle class="star" cx="720" cy="60" r="1.1" style="animation-delay:.9s"/>
      <circle class="star" cx="430" cy="40" r="1" style="animation-delay:2.1s"/><circle class="star" cx="610" cy="40" r="1.3" style="animation-delay:1.5s"/>
      <circle class="star" cx="130" cy="210" r="1" style="animation-delay:2.4s"/><circle class="star" cx="760" cy="220" r="1.2" style="animation-delay:.2s"/>
    </g>

    <!-- gantry tower -->
    <g stroke="none">
      <rect x="300" y="250" width="14" height="300" fill="#2b3660"/>
      <g stroke="#3b487e" stroke-width="3">
        <line x1="307" y1="270" x2="340" y2="300"/><line x1="307" y1="320" x2="340" y2="350"/>
        <line x1="307" y1="370" x2="340" y2="400"/><line x1="307" y1="420" x2="340" y2="450"/>
        <line x1="307" y1="470" x2="340" y2="500"/>
      </g>
    </g>

    <!-- rocket (Titan IIIE-Centaur): core + two solid boosters + payload fairing -->
    <g id="rocket">
      <!-- side boosters -->
      <g>
        <rect x="356" y="250" width="26" height="230" rx="12" fill="url(#body)" stroke="#9aa5b8" stroke-width="1"/>
        <path d="M356 252 q13 -26 26 0 Z" fill="#dfe6f0"/>
        <rect x="418" y="250" width="26" height="230" rx="12" fill="url(#body)" stroke="#9aa5b8" stroke-width="1"/>
        <path d="M418 252 q13 -26 26 0 Z" fill="#dfe6f0"/>
      </g>
      <!-- core stage -->
      <rect x="384" y="190" width="32" height="300" rx="10" fill="url(#body)" stroke="#9aa5b8" stroke-width="1"/>
      <!-- payload fairing / nose -->
      <path d="M384 190 q16 -64 32 0 Z" fill="#eef2f8" stroke="#c3ccda" stroke-width="1"/>
      <!-- detailing -->
      <rect x="384" y="300" width="32" height="7" fill="#c4ccda"/>
      <rect x="384" y="360" width="32" height="7" fill="#c4ccda"/>
      <text x="400" y="250" font-family="Space Grotesk" font-size="9" fill="#2a3566" text-anchor="middle" transform="rotate(90 400 250)" font-weight="700">U S A</text>
      <circle cx="400" cy="225" r="5.5" fill="#1d4ed8"/>
      <!-- engine bells -->
      <rect x="388" y="488" width="24" height="10" rx="3" fill="#8793a8"/>
      <rect x="358" y="478" width="22" height="8" rx="3" fill="#8793a8"/>
      <rect x="420" y="478" width="22" height="8" rx="3" fill="#8793a8"/>
    </g>

    <!-- ignition glow -->
    <ellipse cx="400" cy="500" rx="120" ry="60" fill="url(#glow)"/>
    <!-- flames -->
    <g>
      <path class="flame" d="M392 496 q8 70 8 96 q0 -26 8 -96 q-8 20 -16 0 Z" fill="url(#flameG)"/>
      <path class="flame" d="M360 484 q6 50 6 70 q0 -20 6 -70 q-6 14 -12 0 Z" fill="url(#flameG)" style="animation-delay:.07s"/>
      <path class="flame" d="M422 484 q6 50 6 70 q0 -20 6 -70 q-6 14 -12 0 Z" fill="url(#flameG)" style="animation-delay:.11s"/>
      <path class="flame" d="M396 500 q4 34 4 48 q0 -14 4 -48 q-4 10 -8 0 Z" fill="#fff7d6" style="animation-delay:.04s"/>
    </g>

    <!-- smoke clouds at base -->
    <g>
      <ellipse class="smoke" cx="330" cy="540" rx="60" ry="34" fill="#d8dee8" opacity="0.9"/>
      <ellipse class="smoke" cx="470" cy="545" rx="66" ry="36" fill="#c9d0dc" opacity="0.9"/>
      <ellipse class="smoke" cx="400" cy="560" rx="90" ry="40" fill="#e6eaf1" opacity="0.85"/>
      <ellipse class="smoke" cx="270" cy="560" rx="54" ry="30" fill="#cdd4df" opacity="0.8"/>
      <ellipse class="smoke" cx="540" cy="560" rx="58" ry="32" fill="#d2d9e4" opacity="0.8"/>
    </g>
    <!-- ground -->
    <rect x="0" y="560" width="800" height="40" fill="#121a38"/>
  </svg>

  <!-- part callouts -->
  <div class="tag" style="left: 60%; top: 30%;">Payload fairing → Voyager 1</div>
  <div class="tag" style="left: 62%; top: 52%;">Titan core stage</div>
  <div class="tag" style="left: 20%; top: 58%;">Solid rocket boosters</div>

  <!-- HUD -->
  <div class="hud">
    <div class="label">Countdown</div>
    <div class="big">LIFTOFF</div>
    <div class="label" style="margin-top:8px">Thrust</div>
    <div class="meter"><i></i></div>
  </div>

  <div class="caption">
    <div class="k">September 5, 1977 · Cape Canaveral</div>
    <div class="t">Voyager 1 is on its way 🚀</div>
    <div class="s">Launched on a Titan IIIE-Centaur toward Jupiter and Saturn.</div>
  </div>
</div>
</body>
</html>
